<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #FAFAF7;
    color: #1F2A14;
    font-size: 14px;
    line-height: 1.5;
    padding: 20px 16px 96px;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 1100px; margin: 0 auto; }

  /* ---------- Brand bar ---------- */
  .brand-bar {
    display: flex;
    align-items: center;
    gap: 18px;
    background: white;
    border: 1px solid #E5E5E0;
    border-left: 4px solid #639922;
    border-radius: 12px;
    padding: 14px 20px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .brand-logo {
    height: 56px;
    width: auto;
    display: block;
    flex-shrink: 0;
  }
  .brand-title-block { flex: 1; min-width: 200px; }
  .brand-title {
    font-size: 16px;
    color: #5C5F4F;
    font-weight: 400;
  }
  .brand-title b { color: #173404; font-weight: 600; }
  .brand-meta {
    font-size: 12px;
    color: #888780;
    margin-top: 2px;
  }
  .brand-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
  }
  .btn {
    background: white; border: 1px solid #D5D5CC; color: #3B6D11;
    padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px; font-weight: 500;
    transition: all .15s; font-family: inherit;
  }
  .btn:hover { background: #EAF3DE; border-color: #97C459; }
  .btn-danger { color: #5C5F4F; }
  .btn-danger:hover { background: #FCEBEB; border-color: #F09595; color: #A32D2D; }

  /* ---------- Stage timeline ---------- */
  .stage-bar {
    background: white;
    border: 1px solid #E5E5E0;
    border-radius: 12px;
    padding: 6px;
    margin-bottom: 18px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
  }
  .stage-pill {
    flex: 1;
    min-width: 160px;
    padding: 12px 16px;
    cursor: pointer;
    text-align: left;
    background: white;
    border: 1px solid transparent;
    border-radius: 8px;
    transition: all .15s;
    position: relative;
  }
  .stage-pill:hover:not(.active) {
    background: #F8F8F3;
    border-color: #E5E5E0;
  }
  .stage-pill.active {
    background: #EAF3DE;
    border-color: #97C459;
  }
  .stage-pill.locked { opacity: 0.7; }
  .stage-num {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #888780;
    text-transform: uppercase;
  }
  .stage-pill.active .stage-num { color: #639922; }
  .stage-name {
    font-size: 15px;
    font-weight: 600;
    color: #173404;
    margin: 2px 0;
  }
  .stage-stat {
    font-size: 12px;
    color: #5C5F4F;
  }
  .stage-pill.active .stage-stat { color: #3B6D11; }
  .stage-progress {
    font-size: 11px;
    color: #888780;
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
  }
  .stage-pill.active .stage-progress { color: #3B6D11; font-weight: 500; }
  .stage-pill .lock-badge {
    position: absolute;
    top: 6px; right: 8px;
    font-size: 10px;
    color: #888780;
    background: #F1EFE8;
    padding: 1px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .stage-pill.active .lock-badge { background: white; }

  /* ---------- Bucket ---------- */
  .bucket {
    background: white;
    border: 1px solid #E5E5E0;
    border-radius: 12px;
    margin-bottom: 14px;
    overflow: hidden;
    transition: border-color .15s;
  }
  .bucket:hover { border-color: #D5D5CC; }
  .bucket-header {
    padding: 16px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
  }
  .bucket-header:hover { background: #FAFAF7; }
  .bucket-number {
    font-size: 14px; font-weight: 600; color: #3B6D11;
    background: #EAF3DE;
    min-width: 38px; height: 38px;
    padding: 0 8px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; outline: none;
  }
  .bucket-number:focus { background: #DCE9C5; box-shadow: 0 0 0 2px #97C459; }
  .bucket-title-block { flex: 1; min-width: 0; }
  .bucket-title { font-size: 16px; font-weight: 600; color: #173404; outline: none; padding: 1px 4px; border-radius: 4px; margin-left: -4px; }
  .bucket-title:focus { background: #F8F8F3; box-shadow: 0 0 0 2px #C0DD97; }
  .bucket-subtitle { font-size: 13px; color: #5C5F4F; margin-top: 2px; outline: none; padding: 1px 4px; border-radius: 4px; margin-left: -4px; }
  .bucket-subtitle:focus { background: #F8F8F3; box-shadow: 0 0 0 2px #C0DD97; }
  .bucket-progress { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .progress-bar { width: 70px; height: 6px; background: #F0F0EA; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: #97C459; border-radius: 3px; transition: width .3s; }
  .progress-text { font-size: 12px; color: #5C5F4F; font-weight: 500; min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
  .bucket-delete {
    background: none; border: none; color: #B4B2A9;
    font-size: 18px; cursor: pointer; padding: 4px 9px;
    border-radius: 4px; opacity: 0;
    transition: opacity .15s, color .15s, background .15s;
    flex-shrink: 0; font-family: inherit; line-height: 1;
  }
  .bucket-header:hover .bucket-delete { opacity: 1; }
  .bucket-delete:hover { color: #A32D2D; background: #FCEBEB; }
  .expand-icon { font-size: 11px; color: #888780; transition: transform .2s; width: 14px; text-align: center; }
  .bucket.collapsed .expand-icon { transform: rotate(-90deg); }
  .bucket-body { padding: 0 22px 18px; }
  .bucket.collapsed .bucket-body { display: none; }

  /* ---------- Hub columns ---------- */
  .bucket-hubs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-top: 4px;
  }
  .hub-column {
    border-top: 2px solid #C0DD97;
    padding-top: 12px;
  }
  .hub-column[data-hid="retail"] { border-top-color: #FAC775; }
  .hub-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 14px;
    padding-bottom: 6px;
  }
  .hub-name {
    font-size: 17px;
    font-weight: 600;
    color: #3B6D11;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .hub-column[data-hid="retail"] .hub-name { color: #854F0B; }
  .hub-icon {
    font-size: 14px;
  }
  .hub-stat {
    font-size: 11px;
    color: #888780;
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }
  .hub-column.empty .hub-empty {
    color: #B4B2A9;
    font-size: 12px;
    font-style: italic;
    padding: 8px 0;
  }

  /* ---------- Group ---------- */
  .group { margin-top: 12px; padding-top: 12px; border-top: 1px solid #F0F0EA; }
  .group:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
  .group-header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .group-header-text { flex: 1; min-width: 0; }
  .group-delete {
    background: none; border: none; color: #B4B2A9;
    font-size: 16px; cursor: pointer; padding: 2px 7px;
    border-radius: 4px; opacity: 0;
    transition: opacity .15s, color .15s, background .15s;
    font-family: inherit; line-height: 1;
    flex-shrink: 0;
  }
  .group:hover .group-delete { opacity: 1; }
  .group-delete:hover { color: #A32D2D; background: #FCEBEB; }
  .group-label { font-size: 14px; font-weight: 600; color: #3B6D11; outline: none; padding: 1px 4px; border-radius: 4px; margin-left: -4px; display: inline-block; }
  .group-label:focus { background: #F8F8F3; box-shadow: 0 0 0 2px #C0DD97; }
  .group-subtitle { font-size: 12px; color: #5C5F4F; margin-top: 1px; outline: none; padding: 1px 4px; border-radius: 4px; margin-left: -4px; }
  .group-subtitle:focus { background: #F8F8F3; box-shadow: 0 0 0 2px #C0DD97; }
  .group-note {
    background: #FAEEDA;
    border-left: 3px solid #EF9F27;
    padding: 7px 11px;
    border-radius: 4px;
    font-size: 12px;
    color: #6B3F08;
    margin: 8px 0 10px;
    display: flex; gap: 8px; align-items: center;
  }
  .group-note .note-icon { color: #BA7517; font-weight: 600; }
  .group-note .note-text { outline: none; flex: 1; }
  .group-note .note-text:focus { box-shadow: 0 0 0 2px #FAC775; border-radius: 3px; }
  .group-note .remove-note {
    background: none; border: none; color: #BA7517; cursor: pointer;
    font-size: 14px; padding: 0 4px; opacity: 0; transition: opacity .15s;
    font-family: inherit;
  }
  .group-note:hover .remove-note { opacity: 1; }

  /* ---------- Item ---------- */
  .item {
    display: flex; align-items: center; gap: 11px;
    padding: 5px 8px; border-radius: 4px;
    margin: 0 -8px;
    transition: background .12s;
  }
  .item:hover { background: #FAFAF7; }
  .item-checkbox {
    width: 17px; height: 17px;
    cursor: pointer; accent-color: #639922;
    flex-shrink: 0; margin: 0;
  }
  .item-text {
    flex: 1; font-size: 14px; color: #1F2A14;
    outline: none; padding: 3px 5px; border-radius: 4px;
    min-width: 0; word-wrap: break-word;
  }
  .item-text:focus { background: #F8F8F3; box-shadow: 0 0 0 2px #C0DD97; }
  .item.done .item-text { text-decoration: line-through; color: #888780; }
  .item-delete {
    background: none; border: none; color: #B4B2A9;
    font-size: 16px; cursor: pointer; padding: 2px 7px;
    border-radius: 4px; opacity: 0;
    transition: opacity .15s, color .15s, background .15s;
    flex-shrink: 0; font-family: inherit; line-height: 1;
  }
  .item:hover .item-delete { opacity: 1; }
  .item-delete:hover { color: #A32D2D; background: #FCEBEB; }

  /* ---------- Add buttons ---------- */
  .add-item-btn {
    background: none; border: 1px dashed #D5D5CC; color: #5C5F4F;
    padding: 5px 12px; border-radius: 6px; cursor: pointer;
    font-size: 13px; margin-top: 8px; width: 100%;
    text-align: left; font-weight: 500;
    transition: all .15s; font-family: inherit;
  }
  .add-item-btn:hover {
    background: #EAF3DE; border-color: #97C459;
    border-style: solid; color: #3B6D11;
  }
  .add-group-btn { margin-top: 12px; border-color: #C0DD97; color: #3B6D11; }
  .restore-note-btn {
    background: none; border: 1px dashed #FAC775; color: #BA7517;
    padding: 3px 9px; border-radius: 4px; cursor: pointer;
    font-size: 11px; margin: 4px 0 8px; font-weight: 500;
    font-family: inherit;
  }
  .restore-note-btn:hover { background: #FAEEDA; border-style: solid; }
  .add-bucket-btn {
    display: block;
    background: white;
    border: 2px dashed #C0DD97;
    color: #3B6D11;
    padding: 16px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    width: 100%;
    margin-top: 8px;
    transition: all .15s;
    font-family: inherit;
    text-align: center;
  }
  .add-bucket-btn:hover {
    background: #EAF3DE;
    border-color: #97C459;
    border-style: solid;
  }

  /* ---------- Save indicator ---------- */
  .save-indicator {
    position: fixed; bottom: 20px; right: 20px;
    background: #3B6D11; color: white;
    padding: 7px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 500;
    opacity: 0; transition: opacity .25s, background .2s;
    pointer-events: none;
    box-shadow: 0 4px 12px rgba(59, 109, 17, 0.25);
  }
  .save-indicator.visible { opacity: 1; }
  .save-indicator.error {
    background: #A32D2D;
    box-shadow: 0 4px 12px rgba(163, 45, 45, 0.25);
  }

  /* ---------- Empty placeholders ---------- */
  [contenteditable][data-placeholder]:empty::before {
    content: attr(data-placeholder);
    color: #B4B2A9;
    font-style: italic;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 760px) {
    body { padding: 12px 8px 80px; font-size: 13px; }
    .brand-bar { padding: 12px 14px; gap: 12px; }
    .brand-logo { height: 48px; }
    .brand-title { font-size: 14px; }
    .bucket-hubs { grid-template-columns: 1fr; gap: 8px; }
    .hub-column { border-top: 2px solid; padding-top: 10px; }
    .bucket-header { padding: 14px 16px; gap: 10px; }
    .bucket-body { padding: 0 16px 14px; }
    .bucket-number { min-width: 32px; height: 32px; font-size: 13px; }
    .bucket-title { font-size: 15px; }
    .progress-bar { width: 50px; }
    .btn { padding: 5px 10px; font-size: 12px; }
    .stage-pill { min-width: 140px; padding: 10px 12px; }
    .add-bucket-btn { padding: 14px 16px; font-size: 13px; }
  }
</style>

      // Infrastructure: A → RDC, B,C → Retail, D → RDC
      b.groups.forEach(g => {
        if (g.label && (g.label.startsWith('A.') || g.label.startsWith('D.'))) rdcGroups.push(g);
        else if (g.label && (g.label.startsWith('B.') || g.label.startsWith('C.'))) retailGroups.push(g);
        else rdcGroups.push(g);
      });
    } else {
      // Other buckets: all groups → RDC, empty Retail
      rdcGroups = b.groups;
    }
    if (rdcGroups.length === 0) rdcGroups = [emptyGroup()];
    if (retailGroups.length === 0) retailGroups = [emptyGroup()];
    return {
      id: b.id, number: b.number, name: b.name, subtitle: b.subtitle,
      hubs: [
        { id: 'rdc', name: 'RDC', icon: '🏭', groups: rdcGroups },
        { id: 'retail', name: 'Retail shop', icon: '🏪', groups: retailGroups }
      ]
    };
  });
  return {
    activeStageId: 'socal',
    stages: [
      { id: 'socal', number: 'Stage 1', name: 'SoCal', subtitle: '1 RDC + 6 stores', buckets: buckets },
      { id: 'top5', number: 'Stage 2', name: 'Top 5 States', subtitle: '4 RDCs + 17 malls', buckets: TOP5_BUCKETS }
    ]
  };
}

async function loadData() {
  const value = await tryLoad(STORAGE_KEY);
  if (value) {
    try {
      data = JSON.parse(value);
      if (!data.stages.find(s => s.id === 'top5')) {
        data.stages.push({ id: 'top5', number: 'Stage 2', name: 'Top 5 States', subtitle: '4 RDCs + 17 malls', buckets: TOP5_BUCKETS });
      }
      render();
      return;
    } catch (e) {
      console.warn('Saved data could not be parsed, falling back:', e);
    }
  }

  // Try migrate v2
  const v2 = await tryLoad('livefresh-stage1-roadmap-v2');
  if (v2) {
    try {
      data = migrateFromV2(JSON.parse(v2));
      render();
      save(true);
      return;
    } catch (e) {}
  }

  data = deepClone(DEFAULT_DATA);
  render();
}

async function trySave(key, value) {
  // Try Claude.ai cloud storage first
  if (typeof window.storage !== 'undefined' && window.storage.set) {
    try {
      const r = await window.storage.set(key, value);
      if (r) return { ok: true, backend: 'cloud' };
      console.warn('Cloud save returned null');
    } catch (e) {
      console.warn('Cloud save threw:', e);
    }
  }
  // Fall back to browser localStorage (works when file is downloaded locally)
  try {
    localStorage.setItem(key, value);
    return { ok: true, backend: 'local' };
  } catch (e) {
    console.warn('Local save threw:', e);
  }
  return { ok: false };
}

async function tryLoad(key) {
  if (typeof window.storage !== 'undefined' && window.storage.get) {
    try {
      const r = await window.storage.get(key);
      if (r && r.value) return r.value;
    } catch (e) { /* key may not exist yet — normal on first load */ }
  }
  try {
    const v = localStorage.getItem(key);
    if (v) return v;
  } catch (e) {}
  return null;
}

async function save(immediate) {
  if (saveTimer) clearTimeout(saveTimer);
  const doSave = async () => {
    const result = await trySave(STORAGE_KEY, JSON.stringify(data));
    if (result.ok) flashSaved(result.backend);
    else flashError();
  };
  if (immediate) doSave();
  else saveTimer = setTimeout(doSave, 400);
}

function flashSaved(backend) {
  const ind = document.getElementById('save-indicator');
  ind.textContent = backend === 'local' ? 'Saved locally' : 'Saved';
  ind.classList.remove('error');
  ind.classList.add('visible');
  setTimeout(() => ind.classList.remove('visible'), 1400);
}

function flashError() {
  const ind = document.getElementById('save-indicator');
  ind.textContent = 'Save failed — use Export JSON';
  ind.classList.add('error', 'visible');
}

/* ---------- Finders ---------- */
function activeStage() { return data.stages.find(s => s.id === data.activeStageId); }
function findBucket(bid) { const s = activeStage(); return s ? s.buckets.find(b => b.id === bid) : null; }
function findHub(bid, hid) { const b = findBucket(bid); return b ? b.hubs.find(h => h.id === hid) : null; }
function findGroup(bid, hid, gid) { const h = findHub(bid, hid); return h ? h.groups.find(g => g.id === gid) : null; }
function findItem(bid, hid, gid, iid) { const g = findGroup(bid, hid, gid); return g ? g.items.find(i => i.id === iid) : null; }

function hubStats(hub) {
  let done = 0, total = 0;
  hub.groups.forEach(g => g.items.forEach(i => { total++; if (i.done) done++; }));
  return { done, total };
}
function bucketStats(bucket) {
  let done = 0, total = 0;
  bucket.hubs.forEach(h => { const s = hubStats(h); done += s.done; total += s.total; });
  return { done, total, pct: total > 0 ? Math.round((done / total) * 100) : 0 };
}
function stageStats(stage) {
  let done = 0, total = 0;
  stage.buckets.forEach(b => { const s = bucketStats(b); done += s.done; total += s.total; });
  return { done, total };
}

function updateGlobalProgress() {
  const stage = activeStage();
  if (!stage) return;
  const s = stageStats(stage);
  document.getElementById('global-progress').textContent = s.done + ' / ' + s.total + ' items done';
}

/* ---------- Render ---------- */
function render() {
  renderStageBar();
  document.getElementById('buckets-container').innerHTML =
    activeStage().buckets.map(renderBucket).join('');
  updateGlobalProgress();
}

function renderStageBar() {
  const bar = document.getElementById('stage-bar');
  bar.innerHTML = data.stages.map(s => {
    const stats = stageStats(s);
    const active = s.id === data.activeStageId ? 'active' : '';
    return `
      <div class="stage-pill ${active}" onclick="selectStage('${s.id}')">
        <div class="stage-num">${escapeHTML(s.number)}</div>
        <div class="stage-name">${escapeHTML(s.name)}</div>
        <div class="stage-stat">${escapeHTML(s.subtitle)}</div>
        <div class="stage-progress">${stats.done} / ${stats.total} items done</div>
      </div>
    `;
  }).join('');
}

function renderBucket(bucket) {
  const stats = bucketStats(bucket);
  const collapsed = bucket._collapsed ? 'collapsed' : '';
  return `
    <section class="bucket ${collapsed}" data-bid="${bucket.id}">
      <header class="bucket-header" onclick="onBucketHeaderClick(event, '${bucket.id}')">
        <div class="bucket-number" contenteditable="true" data-field="number" data-bid="${bucket.id}" onclick="event.stopPropagation()">${escapeHTML(bucket.number)}</div>
        <div class="bucket-title-block">
          <div class="bucket-title" contenteditable="true" data-field="name" data-bid="${bucket.id}" onclick="event.stopPropagation()">${escapeHTML(bucket.name)}</div>
          <div class="bucket-subtitle" contenteditable="true" data-field="subtitle" data-bid="${bucket.id}" data-placeholder="Subtitle" onclick="event.stopPropagation()">${escapeHTML(bucket.subtitle)}</div>
        </div>
        <div class="bucket-progress">
          <div class="progress-bar"><div class="progress-fill" style="width:${stats.pct}%"></div></div>
          <div class="progress-text">${stats.done}/${stats.total}</div>
          <button class="bucket-delete" onclick="deleteBucket('${bucket.id}'); event.stopPropagation();" title="Delete this bucket">×</button>
          <div class="expand-icon">▼</div>
        </div>
      </header>
      <div class="bucket-body">
        <div class="bucket-hubs">
          ${bucket.hubs.map(h => renderHub(bucket.id, h)).join('')}
        </div>
      </div>
    </section>
  `;
}

function renderHub(bid, hub) {
  const stats = hubStats(hub);
  const isEmpty = stats.total === 0;
  return `
    <div class="hub-column ${isEmpty ? 'empty' : ''}" data-hid="${hub.id}">
      <div class="hub-header">
        <span class="hub-name">${escapeHTML(hub.name)}</span>
        <span class="hub-stat">${stats.done}/${stats.total}</span>
      </div>
      ${hub.groups.map(g => renderGroup(bid, hub.id, g)).join('')}
      <button class="add-item-btn add-group-btn" onclick="addGroup('${bid}', '${hub.id}')">+ Add sub-section</button>
    </div>
  `;
}

function renderGroup(bid, hid, group) {
  const showLabel = group.label !== null;
  const showSubtitle = group.subtitle !== null;
  const hasNote = group.note !== null && group.note !== '';

  let html = `<div class="group" data-gid="${group.id}">`;

  if (showLabel) {
    html += `<div class="group-header">`;
    html += `<div class="group-header-text">`;
    html += `<div class="group-label" contenteditable="true" data-field="label" data-bid="${bid}" data-hid="${hid}" data-gid="${group.id}" data-placeholder="Sub-section label">${escapeHTML(group.label || '')}</div>`;
    if (showSubtitle) {
      html += `<div class="group-subtitle" contenteditable="true" data-field="subtitle" data-bid="${bid}" data-hid="${hid}" data-gid="${group.id}" data-placeholder="Sub-section subtitle">${escapeHTML(group.subtitle || '')}</div>`;
    }
    html += `</div>`;
    html += `<button class="group-delete" onclick="deleteGroup('${bid}', '${hid}', '${group.id}')" title="Delete this sub-section">×</button>`;
    html += `</div>`;
  }

  if (hasNote) {
    html += `<div class="group-note">`;
    html += `<span class="note-text" contenteditable="true" data-field="note" data-bid="${bid}" data-hid="${hid}" data-gid="${group.id}">${escapeHTML(group.note)}</span>`;
    html += `<button class="remove-note" onclick="removeNote('${bid}', '${hid}', '${group.id}')" title="Remove flag">×</button>`;
    html += `</div>`;
  } else if (showLabel) {
    html += `<button class="restore-note-btn" onclick="addNote('${bid}', '${hid}', '${group.id}')">+ Add flag</button>`;
  }

  html += group.items.map(item => renderItem(bid, hid, group.id, item)).join('');
  html += `<button class="add-item-btn" onclick="addItem('${bid}', '${hid}', '${group.id}')">+ Add item</button>`;
  html += `</div>`;

  return html;
}

function renderItem(bid, hid, gid, item) {
  return `
    <div class="item ${item.done ? 'done' : ''}" data-iid="${item.id}">
      <input type="checkbox" class="item-checkbox" ${item.done ? 'checked' : ''} onchange="toggleItem('${bid}', '${hid}', '${gid}', '${item.id}')">
      <div class="item-text" contenteditable="true" data-field="text" data-bid="${bid}" data-hid="${hid}" data-gid="${gid}" data-iid="${item.id}" data-placeholder="Type an item">${escapeHTML(item.text)}</div>
      <button class="item-delete" onclick="deleteItem('${bid}', '${hid}', '${gid}', '${item.id}')" title="Delete item">×</button>
    </div>
  `;
}

/* ---------- Stage actions ---------- */
function selectStage(stageId) {
  if (data.activeStageId === stageId) return;
  data.activeStageId = stageId;
  // Don't persist stage selection — it's a UI choice
  render();
}

/* ---------- Bucket / item actions ---------- */
function onBucketHeaderClick(event, bid) {
  if (event.target.isContentEditable) return;
  if (event.target.closest('.bucket-number, .bucket-title, .bucket-subtitle, .bucket-delete')) return;
  const bucket = findBucket(bid);
  bucket._collapsed = !bucket._collapsed;
  document.querySelector(`.bucket[data-bid="${bid}"]`).classList.toggle('collapsed', bucket._collapsed);
}

function toggleItem(bid, hid, gid, iid) {
  const item = findItem(bid, hid, gid, iid);
  if (!item) return;
  item.done = !item.done;
  const row = document.querySelector(`.item[data-iid="${iid}"]`);
  if (row) row.classList.toggle('done', item.done);
  const bucket = findBucket(bid);
  const bstats = bucketStats(bucket);
  const bucketEl = document.querySelector(`.bucket[data-bid="${bid}"]`);
  if (bucketEl) {
    bucketEl.querySelector('.progress-fill').style.width = bstats.pct + '%';
    bucketEl.querySelector('.progress-text').textContent = bstats.done + '/' + bstats.total;
    const hub = findHub(bid, hid);
    const hstats = hubStats(hub);
    const hubEl = bucketEl.querySelector(`.hub-column[data-hid="${hid}"]`);
    if (hubEl) hubEl.querySelector('.hub-stat').textContent = hstats.done + '/' + hstats.total;
  }
  updateGlobalProgress();
  renderStageBar();
  save(true);
}

function addItem(bid, hid, gid) {
  const group = findGroup(bid, hid, gid);
  if (!group) return;
  const newItem = { id: uid(), text: '', done: false };
  group.items.push(newItem);
  render();
  save(true);
  setTimeout(() => focusEditable(`.item-text[data-iid="${newItem.id}"]`, true), 30);
}

function deleteItem(bid, hid, gid, iid) {
  const group = findGroup(bid, hid, gid);
  if (!group) return;
  group.items = group.items.filter(i => i.id !== iid);
  render();
  save(true);
}

function addGroup(bid, hid) {
  const hub = findHub(bid, hid);
  if (!hub) return;
  const newGroup = {
    id: uid(),
    label: 'New sub-section',
    subtitle: '',
    note: '',
    items: []
  };
  hub.groups.push(newGroup);
  render();
  save(true);
  setTimeout(() => focusEditable(`.group[data-gid="${newGroup.id}"] .group-label`, true), 30);
}

function suggestNextNumber() {
  const stage = activeStage();
  const nums = stage.buckets.map(b => parseInt(b.number, 10)).filter(n => !isNaN(n));
  const next = nums.length ? Math.max(...nums) + 1 : 1;
  return String(next).padStart(2, '0');
}

function addBucket() {
  const stage = activeStage();
  const newBucket = {
    id: uid(),
    number: suggestNextNumber(),
    name: 'New bucket',
    subtitle: '',
    hubs: [
      { id: 'rdc', name: 'RDC', icon: '🏭', groups: [emptyGroup()] },
      { id: 'retail', name: 'Retail shop', icon: '🏪', groups: [emptyGroup()] }
    ]
  };
  stage.buckets.push(newBucket);
  render();
  save(true);
  setTimeout(() => {
    focusEditable(`.bucket[data-bid="${newBucket.id}"] .bucket-title`, true);
    const el = document.querySelector(`.bucket[data-bid="${newBucket.id}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 30);
}

function deleteBucket(bid) {
  const bucket = findBucket(bid);
  if (!bucket) return;
  const name = bucket.name || 'this bucket';
  if (!confirm(`Delete "${name}"?\n\nAll its sub-sections and items in both RDC and Retail will be lost. This cannot be undone.`)) return;
  const stage = activeStage();
  stage.buckets = stage.buckets.filter(b => b.id !== bid);
  render();
  save(true);
}

function deleteGroup(bid, hid, gid) {
  const group = findGroup(bid, hid, gid);
  if (!group) return;
  const label = group.label || 'this sub-section';
  const itemCount = group.items.length;
  const msg = itemCount > 0
    ? `Delete "${label}"?\n\nAll ${itemCount} item${itemCount === 1 ? '' : 's'} inside will be lost. This cannot be undone.`
    : `Delete "${label}"?\n\nThis cannot be undone.`;
  if (!confirm(msg)) return;
  const hub = findHub(bid, hid);
  hub.groups = hub.groups.filter(g => g.id !== gid);
  render();
  save(true);
}

function removeNote(bid, hid, gid) {
  const group = findGroup(bid, hid, gid);
  if (!group) return;
  group.note = '';
  render();
  save(true);
}

function addNote(bid, hid, gid) {
  const group = findGroup(bid, hid, gid);
  if (!group) return;
  group.note = 'Flag';
  render();
  save(true);
  setTimeout(() => focusEditable(`.group[data-gid="${gid}"] .note-text`, true), 30);
}

function focusEditable(selector, selectAll) {
  const el = document.querySelector(selector);
  if (!el) return;
  el.focus();
  if (selectAll) {
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
}

function expandAll() {
  activeStage().buckets.forEach(b => b._collapsed = false);
  document.querySelectorAll('.bucket').forEach(el => el.classList.remove('collapsed'));
}

function collapseAll() {
  activeStage().buckets.forEach(b => b._collapsed = true);
  document.querySelectorAll('.bucket').forEach(el => el.classList.add('collapsed'));
}

function resetAll() {
  if (!confirm('Reset everything to defaults?\n\nAll your edits, additions, and check states (in BOTH stages) will be lost.')) return;
  data = deepClone(DEFAULT_DATA);
  render();
  save(true);
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'livefresh-roadmap.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed.stages || !Array.isArray(parsed.stages)) {
        alert('That file does not look like a Live Fresh roadmap JSON.');
        return;
      }
      if (!confirm('Replace current roadmap with imported data?\n\nYour current state will be overwritten.')) return;
      data = parsed;
      if (!data.activeStageId) data.activeStageId = data.stages[0].id;
      render();
      save(true);
    } catch (err) {
      alert('Could not import file: ' + err.message);
    }
  };
  input.click();
}

/* ---------- Inline editing handlers ---------- */
function handleEdit(target) {
  const field = target.dataset.field;
  const bid = target.dataset.bid;
  const hid = target.dataset.hid;
  const gid = target.dataset.gid;
  const iid = target.dataset.iid;
  const text = target.textContent.trim();
  let changed = false;
  if (iid) {
    const item = findItem(bid, hid, gid, iid);
    if (item && item[field] !== text) { item[field] = text; changed = true; }
  } else if (gid) {
    const group = findGroup(bid, hid, gid);
    if (group && group[field] !== text) { group[field] = text; changed = true; }
  } else if (bid) {
    const bucket = findBucket(bid);
    if (bucket && bucket[field] !== text) { bucket[field] = text; changed = true; }
  }
  if (changed) save();
}

document.addEventListener('focusin', (e) => {
  if (e.target.isContentEditable && e.target.dataset.field) {
    e.target.dataset.original = e.target.textContent;
  }
});

document.addEventListener('focusout', (e) => {
  if (e.target.isContentEditable && e.target.dataset.field) {
    handleEdit(e.target);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.target.isContentEditable && e.target.dataset.field) {
    if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
    if (e.key === 'Escape') {
      e.target.textContent = e.target.dataset.original || '';
      e.target.blur();
    }
  }
});

document.addEventListener('paste', (e) => {
  if (e.target.isContentEditable && e.target.dataset.field) {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  }
});

loadData();
</script>
